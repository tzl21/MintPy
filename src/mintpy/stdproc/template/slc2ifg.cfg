# vim: set filetype=cfg:
##------------------------ slc2ifg.cfg ------------------------##
## Configuration file for the insarflow engine (MintPy style, no section header)
## All options can be set to 'auto' to use default values.
## Parameter naming: slc2ifg.<step>.<param> = auto  #[...], auto for <default>
## The engine (`insarflow <this file>`) is the only pipeline orchestrator.
## Keys marked "(standalone only)" are used by the per-step CLI scripts and
## ignored by the engine.

## Global settings
mintpy.slc2ifg.engine = auto  #[none | insarflow | auto], auto for the engine (dask) when importable, else the basic executor
slc2ifg.work_dir = auto  #[path], auto for ./  (all engine outputs live under this dir)
slc2ifg.slc_input = auto  #[path], auto for (required)
slc2ifg.processor = auto  #[isce3, isce2], auto for isce3
slc2ifg.ifg_pattern = auto  #[**/*.int.tif (isce3) / **/*.int (isce2)], auto for **/*.int.tif (isce3) or **/*.int (isce2) based on processor
slc2ifg.cor_pattern = auto  #[**/*.phsig.coh.tif (isce3) / **/*.phsig.coh (isce2)], auto for phase-sigma coherence pattern
slc2ifg.unw_pattern = auto  #[**/*.unw.tif (isce3) / **/*.unw (isce2)], auto for unwrapped phase pattern
## Unified SLC pattern — single key for the whole pipeline (generate_ifgram /
## crop_slc / generate_coh / select quick-coherence).  Legacy aliases
## (slc2ifg.generate_ifgram.slc_pattern, slc2ifg.crop_slc.pattern,
## slc2ifg.generate_coh.slc_pattern, slc2ifg.ifgram_list.select.slc_pattern)
## keep working with a deprecation warning.
slc2ifg.slc_pattern = auto  #[glob], auto for *.slc.* (isce3) / *.slc (isce2)
## AOI bbox (single source of truth for the crop extent).  Read-time crop
## (default): when crop_slc is NOT in engine.stages, every SLC-reading stage
## (generate_ifgram, complex_coh and the select-mode quick coherence) reads
## only this region of the SLC h5/GeoTIFF — no cropped SLC files are stored.
## With crop_slc enabled it is the write-to-disk crop extent.
## Neither bbox nor crop_slc -> the full SLC extent is processed.
## (isce2 radar SLCs are not georeferenced: bbox requires the crop_slc stage.)
slc2ifg.bbox = auto  #[W S E N, float float float float], auto for None (full extent); legacy alias: slc2ifg.crop_slc.wsen
slc2ifg.bbox_buffer = auto  #[float, degrees], auto for 0.0. Extra margin around bbox so that coherence computation windows (complex coherence and phase-sigma) fully cover bbox after multilooking. Minimum: max(cc_window_size, ps_window_size)/2 * lks_y * pixel_size_y; legacy alias: slc2ifg.crop_slc.buffer

## Engine parameters (Dask scheduling, resources, product management)
engine.stages = auto  #[auto | stage1,stage2,...], processing-chain order — the single authoritative chain spec; auto for the default lean chain (ifgram_list,generate_ifgram,multilook,filter,stitch,unwrap); list optional stages (complex_coh, crop_slc, phsig_coh, atmosphere) to enable them
engine.scheduler = auto  #[threaded | distributed], auto for threaded (distributed requires a dask.distributed cluster)
engine.max_workers = auto  #[int], auto for n_cpu (the single concurrency knob; legacy slc2ifg.max_workers is ignored)
engine.mem_limit_gb = auto  #[float], auto for 80% of host memory
engine.gpu = auto  #[auto | true | false], auto for (detect cupy; GPU kernels for phsig_coh/filter/complex_coh)
engine.gpu_mem_limit_gb = auto  #[float], auto for 70% of GPU memory (caps GPU concurrency and CuPy's pool)
engine.tile_size = auto  #[int, pixels], auto for 0 (off); >0 enables intra-interferogram tiling (bit-identical results); when GPU is on and this is unset, the engine auto-picks a VRAM-budgeted size
engine.input_dir = auto  #[path], auto for <generate_ifgram.output_dir>; mid-chain entry: root of the input products ({root}/{date1}_{date2}/... layout, same as the engine's output tree). Only used when generate_ifgram is NOT in engine.stages.
engine.input_variant = auto  #[fullres | mli | filt | filt_mli], auto for fullres; input ifg variant for mid-chain entry (e.g. filt_mli = start from filtered interferograms)
engine.keep_intermediates = auto  #[none | all | tool1,tool2,...], auto for none (keep only unw/conncomp/phsig)
engine.keep_variants = auto  #[fullres,mli,filt_mli,filt], auto for none (extra ifg variants to keep)
engine.manifest_hash = auto  #[True, False], auto for False (content hash in manifest)
engine.work_dir = auto  #[path], auto for <work_dir>/engine

## crop_slc parameters (tool enabled only when listed in engine.stages)
## NOTE: the AOI keys slc2ifg.bbox / slc2ifg.bbox_buffer above are the single
## source of truth; crop_slc.wsen / crop_slc.buffer are deprecated aliases.
slc2ifg.crop_slc.pattern = auto  #[glob], auto for *.slc.* (isce3) / *.slc (isce2)
slc2ifg.crop_slc.geom_dir = auto  #[path], auto for (required for isce2)
slc2ifg.crop_slc.prefix = auto  #[str], auto for ''
slc2ifg.crop_slc.by_burst = auto  #[True, False], auto for False (per-burst output dirs)
slc2ifg.crop_slc.no_skip_existing = auto  #[True, False], auto for False (standalone only)

## ifgram_list parameters
slc2ifg.ifgram_list.num_connections = auto  #[int], auto for 5 (sequential/reference) / 3 (select k-NN skeleton)
slc2ifg.ifgram_list.mode = auto  #[sequential, reference, select, file], auto for sequential; mode details: docs/ifgram_list_modes.md
slc2ifg.ifgram_list.pair_file = auto  #[path], auto for None; mode=file: explicit pair list (one 'YYYYMMDD-YYYYMMDD' per line; hash comments and blank lines allowed) used VERBATIM — num_connections / select.* / start_date / end_date / exclude_date are ignored, and every referenced date must have an SLC; relative paths resolve against work_dir
slc2ifg.ifgram_list.start_date = auto  #[YYYYMMDD or None], auto for None (only keep dates >= start)
slc2ifg.ifgram_list.end_date = auto  #[YYYYMMDD or None], auto for None (only keep dates <= end)
slc2ifg.ifgram_list.exclude_date = auto  #[YYYYMMDD[,YYYYMMDD,...] or None], auto for None (drop specific bad SLC date(s) BEFORE pairing, e.g. 20200101,20200615; also filters the crop file list)

## ifgram_list select mode (coherence-aware connected interferogram selection)
## Guarantees: the selected network is connected (SBAS design matrix full
## rank after removing the reference date); edges are chosen by descending
## coherence quality (maximum spanning tree + greedy augmentation).
## See docs/ifgram_selection.md for the theory and usage.
slc2ifg.ifgram_list.select.weight_source = auto  #[model | coherence | mixed], auto for model
slc2ifg.ifgram_list.select.annual_windows = auto  #[auto | center:tol day pairs, comma separated | none], auto for auto (derive half-year + one-year windows from the repeat cycle; explicit e.g. 182:10,365:15 overrides; none/off/0 = disable). Single canonical knob for annual/one-year pairs in ALL modes (the legacy slc2ifg.ifgram_list.oneyear_interferograms key was removed; one-year only = 365:<range>)
slc2ifg.ifgram_list.select.temp_baseline_max = auto  #[int days or None], auto for None (also include ALL pairs within this baseline)
slc2ifg.ifgram_list.select.perp_baseline_max = auto  #[float m or None], auto for None (perpendicular-baseline cap)
slc2ifg.ifgram_list.select.perp_baseline_file = auto  #[path or None], auto for None (two-column 'date bperp' text file)
slc2ifg.ifgram_list.select.coh_dir = auto  #[path or None], auto for None (existing {date1}_{date2}/xxx_coh rasters for measured weights)
slc2ifg.ifgram_list.select.coh_kind = auto  #[phsig | cpx], auto for phsig
slc2ifg.ifgram_list.select.coh_variant = auto  #[fullres | mli | filt | filt_mli], auto for filt_mli
slc2ifg.ifgram_list.select.coh_stat = auto  #[mean | median | usable_frac | fisher], auto for mean
slc2ifg.ifgram_list.select.coh_usable_threshold = auto  #[float], auto for 0.3 (stat=usable_frac only)
## On-the-fly coherence (no whole-image read).  With slc2ifg.bbox set (the
## AOI is already cropped), ONLY that window of each SLC is read and
## block-averaged by quick_nlks — the default is 1 (full window resolution)
## because the cropped AOI is small; quick_max_pixels raises the factor
## automatically for very large AOIs.  Without a bbox, each SLC is instead
## read as a quick_grid x quick_grid sample of quick_block x quick_block px
## windows (~0.04% of the scene, ~9000x less I/O than a full-image read).
slc2ifg.ifgram_list.select.quick_window = auto  #[int], auto for 5 (coherence estimation window)
slc2ifg.ifgram_list.select.quick_nlks = auto  #[int], auto for 1 (block-mean downsampling factor of the bbox window; 1 = full resolution)
slc2ifg.ifgram_list.select.quick_max_pixels = auto  #[int], auto for 1048576 (cap on the bbox window size; the factor is raised automatically above it)
slc2ifg.ifgram_list.select.quick_grid = auto  #[int], auto for 12 (whole-scene sampling grid per side, e.g. 12x12 windows; no-bbox path only)
slc2ifg.ifgram_list.select.quick_block = auto  #[int], auto for 16 (whole-scene sampled window size in pixels, e.g. 16x16; no-bbox path only)
slc2ifg.ifgram_list.select.quick_debias = auto  #[True, False], auto for True (Touzi 1999 bias correction)
slc2ifg.ifgram_list.select.quick_max_workers = auto  #[int], auto for 1 (threads for on-the-fly coherence; >1 parallelises the per-pair screening)
slc2ifg.ifgram_list.select.quick_stat = auto  #[mean | median | usable_frac | fisher], auto for mean (statistic over the sampled coherence map)
slc2ifg.ifgram_list.select.quick_usable_threshold = auto  #[float], auto for 0.3 (stat=usable_frac only)
slc2ifg.ifgram_list.select.model_tau_days = auto  #[float days], auto for 90.0 (temporal decorrelation time constant)
slc2ifg.ifgram_list.select.model_gamma0 = auto  #[float], auto for 1.0 (coherence at zero temporal baseline)
slc2ifg.ifgram_list.select.min_degree = auto  #[int], auto for 2 (minimum interferograms per date; 0/1 = pure spanning tree)
slc2ifg.ifgram_list.select.max_pairs = auto  #[int or None], auto for None (global edge budget)
slc2ifg.ifgram_list.select.quality_threshold = auto  #[float or None], auto for None (augmentation floor on the quality weight)
slc2ifg.ifgram_list.select.robust = auto  #[True, False], auto for False (repair bridges -> 2-edge robustness where possible)
slc2ifg.ifgram_list.select.verify = auto  #[True, False], auto for True (rank/connectivity verification)
slc2ifg.ifgram_list.select.report = auto  #[path or None], auto for None (write the selection report JSON)
slc2ifg.ifgram_list.select.dot = auto  #[path or None], auto for None (write the selected network as GraphViz DOT)

## generate_ifgram parameters (merged VRT creation and interferogram generation)
slc2ifg.generate_ifgram.subdataset = auto  #[str, for Opera GSLC .h5], auto for /data/VV
slc2ifg.generate_ifgram.no_verify = auto  #[True, False], auto for False
slc2ifg.generate_ifgram.only_vrt = auto  #[True, False], auto for False
slc2ifg.generate_ifgram.output_dir = auto  #[path], auto for <work_dir>/ifgrams — ROOT of all interferogram products (fullres/mli/filt/coh/unw/conncomp), engine default output for every stage

## multilook parameters
slc2ifg.multilook.lks_y = auto  #[int], auto for 1
slc2ifg.multilook.lks_x = auto  #[int], auto for 1
slc2ifg.multilook.method = auto  #[mean, median, nearest], auto for mean
slc2ifg.multilook.geom_dir = auto  #[path], auto for None (standalone only)

## filter parameters (backend switch: filter_type; each backend owns its namespace)
slc2ifg.filter.filter_type = auto  #[goldstein, long_wavelength], auto for goldstein (backend switch)
# --- goldstein backend ---
slc2ifg.filter.goldstein.alpha = auto  #[float], auto for 0.8
slc2ifg.filter.goldstein.psize = auto  #[int], auto for 32
# --- long_wavelength backend ---
slc2ifg.filter.long_wavelength.wavelength_cutoff = auto  #[float, meters], auto for 25000
slc2ifg.filter.long_wavelength.pixel_spacing = auto  #[float, meters], auto for 30

## generate_coh parameters
## complex coherence (Phase 1, per-burst, optional — enable by listing complex_coh in engine.stages)
## phase-sigma coherence (Phase 3, uniform — runs on the last processing stage)
slc2ifg.generate_coh.ps_window_size = auto  #[int], auto for 5
slc2ifg.generate_coh.ps_gradient_window = auto  #[int], auto for 5
slc2ifg.generate_coh.ps_nlks = auto  #[float], auto for 1.0 (engine default: lks_y*lks_x when multilook enabled)
slc2ifg.generate_coh.keep_sigma = auto  #[True, False], auto for False
slc2ifg.generate_coh.cc_window_size = auto  #[int], auto for 5
slc2ifg.generate_coh.cc_window_type = auto  #[triangular | uniform], auto for triangular (ISCE2-compatible Bartlett window)
# Note: skip_phase_sigma / skip_complex_coherence are controlled automatically by the engine
slc2ifg.generate_coh.skip_phase_sigma = auto  #[True, False], auto for False (standalone only)
slc2ifg.generate_coh.skip_complex_coherence = auto  #[True, False], auto for False (standalone only)

## stitch parameters (multi-burst merge; engine: fixed <work_dir>/stitched)
slc2ifg.stitch.file_types = auto  #[str], auto for .int.tif,.cpx.coh.tif (isce3) / .int,.cpx.coh (isce2)
slc2ifg.stitch.out_bounds = auto  #[W S E N float], auto for None (stitch full burst union extent); set to exact bbox to crop stitched products

## unwrap parameters
## Naming convention: stage-level key selects the backend; every backend gets
## its own namespace `slc2ifg.unwrap.<backend>.<param>`.  The legacy flat keys
## (slc2ifg.unwrap.cost_mode, ...) still work with a deprecation warning.
slc2ifg.unwrap.algorithm = auto  #[snaphu | phass | icu], auto for snaphu (backend switch; phass/icu reserved)
# Coherence (weight) input: auto | complex | phsig | none
#   auto    = phsig if the phsig_coh stage is enabled, else complex if
#             complex_coh is enabled (fullres only), else none
#   complex = requires the complex_coh stage + fullres unwrap (error if missing)
#   phsig   = requires the phsig_coh stage (error if missing)
#   none    = no coherence file — SNAPHU weight set to 1 (uniform)
slc2ifg.unwrap.coh_type = auto  #[auto | complex | phsig | none], auto for the enabled coherence stage
# External coherence input (path + pattern) for SNAPHU weighting, e.g. to
# reuse coherence rasters computed elsewhere (ISCE2, another filter/multilook)
# instead of the engine-generated ones.  Per pair {date1}_{date2} the file is
# looked up as coh_dir/{date1}_{date2}/{pattern} first, then coh_dir/{pattern};
# the first match feeds SNAPHU (overrides coh_type resolution for that pair).
slc2ifg.unwrap.coh_dir = auto  #[path or None], auto for None (use engine-generated coherence)
slc2ifg.unwrap.coh_pattern = auto  #[glob], auto for *.tif
# --- snaphu backend (SNAPHU binary via subprocess, full parameter control) ---
# SNAPHU core
slc2ifg.unwrap.snaphu.cost_mode = auto  #[topo, defo, smooth], auto for smooth
slc2ifg.unwrap.snaphu.init_method = auto  #[mst, mcf], auto for mcf
slc2ifg.unwrap.snaphu.nlooks = auto  #[float], auto for multilook product or 1.0
# Deformation mode (defo cost only)
slc2ifg.unwrap.snaphu.defo_max_cycles = auto  #[float, cycles], auto for 1.2
slc2ifg.unwrap.snaphu.defo_thresh_factor = auto  #[float], auto for 1.2
slc2ifg.unwrap.snaphu.defo_lay_const = auto  #[float], auto for 0.9
slc2ifg.unwrap.snaphu.wavelength = auto  #[float, meters], auto for 0.05546576 (S1 C-band)
# Tiling (SNAPHU internal tiling, unrelated to engine.tile_size)
slc2ifg.unwrap.snaphu.ntiles_row = auto  #[int], auto for 1
slc2ifg.unwrap.snaphu.ntiles_col = auto  #[int], auto for 1
slc2ifg.unwrap.snaphu.tile_overlap = auto  #[int], auto for 0
slc2ifg.unwrap.snaphu.nproc = auto  #[int], auto for 1
slc2ifg.unwrap.snaphu.tile_cost_thresh = auto  #[int], auto for 500
slc2ifg.unwrap.snaphu.min_region_size = auto  #[int], auto for 100
# Connected components
slc2ifg.unwrap.snaphu.min_conncomp_frac = auto  #[float], auto for 0.01
slc2ifg.unwrap.snaphu.conncomp_thresh = auto  #[float], auto for 300
slc2ifg.unwrap.snaphu.max_ncomps = auto  #[int], auto for 32
slc2ifg.unwrap.snaphu.no_conncomp_out = auto  #[True, False], auto for False
# Phase gradient window
slc2ifg.unwrap.snaphu.phase_grad_window_psi = auto  #[int], auto for 7
slc2ifg.unwrap.snaphu.phase_grad_window_dpsi = auto  #[int], auto for 7
# Optional files
slc2ifg.unwrap.snaphu.mask_file = auto  #[path], auto for None
slc2ifg.unwrap.snaphu.init_phase = auto  #[path], auto for None
slc2ifg.unwrap.snaphu.scratch_dir = auto  #[path], auto for None
slc2ifg.unwrap.snaphu.keep_scratch = auto  #[True, False], auto for False
slc2ifg.unwrap.snaphu.binary = auto  #[path], auto for (auto-detect)
